name: release

# Builds and publishes installers only when a commit pushed to main says so, e.g.
#   git commit -m "release version:0.1.0"
#   git commit -m "Release version: 1.2.0-beta.1 — new converter"
# The commit message must contain the word "release" and "version:<x.y.z>".

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.parse.outputs.release }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          shopt -s nocasematch
          re='version:[[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)'
          if [[ "$MESSAGE" == *release* && "$MESSAGE" =~ $re ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Releasing version ${BASH_REMATCH[1]}"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No 'release' + 'version:x.y.z' in the commit message; skipping."
          fi

  test:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p okkhor-core

  bundle:
    needs: [gate, test]
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # Stamp the version from the commit message into every manifest, so the
      # installers and the release carry the same number.
      - name: Set version ${{ env.VERSION }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const toml = fs.readFileSync("Cargo.toml", "utf8").replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("Cargo.toml", toml);
          '

      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarisation (optional): APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          args: ${{ matrix.args }}
          tagName: v${{ env.VERSION }}
          releaseName: BanglaOkkhor v${{ env.VERSION }}
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
